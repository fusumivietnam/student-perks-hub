version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    ignore:
      # Keep Node type definitions aligned with the Node 24 runtime baseline.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      runtime:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      supabase:
        patterns:
          - "@supabase/*"
          - "supabase"
      ui-styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "lucide-react"
      tooling:
        patterns:
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@types/*"
        exclude-patterns:
          - "@types/react"
          - "@types/react-dom"
      remaining-low-risk:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "@supabase/*"
          - "supabase"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "tailwind-merge"
          - "lucide-react"
          - "typescript"
          - "eslint"
          - "eslint-*"
          - "@types/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

name: Managed State Recovery Rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/managed-state-recovery-rehearsal.yml"
      - "scripts/managed-state-recovery-rehearsal.mjs"
      - "scripts/local-auth-identity-roundtrip.mjs"
      - "scripts/validate-managed-state-evidence.mjs"
      - "scripts/validate-managed-state-evidence.test.mjs"
      - "scripts/recovery-change-scope.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "supabase/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/managed-state-recovery-rehearsal.yml"
      - "scripts/managed-state-recovery-rehearsal.mjs"
      - "scripts/local-auth-identity-roundtrip.mjs"
      - "scripts/validate-managed-state-evidence.mjs"
      - "scripts/validate-managed-state-evidence.test.mjs"
      - "scripts/recovery-change-scope.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "supabase/**"
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-state-recovery-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Detect recovery relevance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Supabase/recovery changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/recovery-change-scope.sh >> "${GITHUB_OUTPUT}"

  rehearse:
    name: Rehearse Auth and Storage recovery boundary
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase with Auth and Storage
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase stop --no-backup || true
          pnpm exec supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Rebuild deterministic local state
        run: pnpm db:reset

      - name: Test evidence fail-closed semantics
        run: node --test scripts/validate-managed-state-evidence.test.mjs

      - name: Install PostgreSQL client for isolated Auth identity roundtrip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18

      - name: Verify original synthetic Auth identity and password roundtrip
        env:
          PATH: /usr/lib/postgresql/18/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: node scripts/local-auth-identity-roundtrip.mjs

      - name: Exercise managed-state loss and recovery
        run: node scripts/managed-state-recovery-rehearsal.mjs

      - name: Validate structured evidence
        run: node scripts/validate-managed-state-evidence.mjs managed-state-recovery-evidence.json

      - name: Upload non-sensitive recovery evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-state-recovery-evidence-${{ github.run_id }}
          path: managed-state-recovery-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish rehearsal summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Managed-state recovery rehearsal"
            echo ""
            echo "- Target: ephemeral local Supabase"
            echo "- Production data copied: no"
            echo "- Production secrets used: no"
            echo "- Auth mode: forced re-authentication via provider Admin/Auth APIs"
            echo "- Storage mode: object-byte restore via provider Storage API"
            echo "- Evidence retention: 90 days"
            echo "- Production readiness implication: none; Production watch remains fail-closed for non-zero managed state"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

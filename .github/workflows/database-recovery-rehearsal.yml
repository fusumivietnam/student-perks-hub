name: Database Recovery Rehearsal

on:
  pull_request:
    paths:
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/database-recovery-rehearsal.yml"
      - "scripts/database-backup.sh"
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    # Weekly drift detection for the complete encrypted backup/restore path.
    - cron: "23 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-recovery-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  restore-rehearsal:
    name: Restore representative local backup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      BACKUP_ENCRYPTION_PASSPHRASE: "local-rehearsal-only-not-a-production-secret"
      RECOVERY_EVIDENCE_RETENTION_DAYS: "90"
      EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Record rehearsal start
        id: timing
        shell: bash
        run: echo "started_epoch=$(date -u +%s)" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Start local database
        run: pnpm exec supabase db start

      - name: Build representative source state
        run: pnpm exec supabase db reset --local

      - name: Resolve local database URL
        id: database
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(pnpm exec supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "${db_url}"
          echo "url=${db_url}" >> "${GITHUB_OUTPUT}"

      - name: Record representative counts before backup
        id: before
        env:
          DB_URL: ${{ steps.database.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          categories="$(psql "${DB_URL}" -Atc 'select count(*) from public.categories')"
          offers="$(psql "${DB_URL}" -Atc 'select count(*) from public.offers')"
          test "${categories}" -gt 0
          test "${offers}" -gt 0
          echo "categories=${categories}" >> "${GITHUB_OUTPUT}"
          echo "offers=${offers}" >> "${GITHUB_OUTPUT}"

      - name: Create encrypted representative backup
        id: backup
        env:
          SUPABASE_DB_URL: ${{ steps.database.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rehearsal-backup
          archive="$(bash scripts/database-backup.sh rehearsal-backup)"
          sha256sum --check "${archive}.sha256"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Decrypt backup in ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore-input
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE \
            -in "${{ steps.backup.outputs.archive }}" |
            tar -xzf - -C restore-input
          test -s restore-input/data.sql
          test -s restore-input/schema.sql
          test -s restore-input/history_data.sql

      - name: Rebuild clean target from versioned migrations
        run: pnpm exec supabase db reset --local --no-seed

      - name: Restore representative data
        env:
          DB_URL: ${{ steps.database.outputs.url }}
        run: psql --single-transaction --variable ON_ERROR_STOP=1 --file restore-input/data.sql --dbname "${DB_URL}"

      - name: Verify restored data and authorization tests
        env:
          DB_URL: ${{ steps.database.outputs.url }}
          EXPECTED_CATEGORIES: ${{ steps.before.outputs.categories }}
          EXPECTED_OFFERS: ${{ steps.before.outputs.offers }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql "${DB_URL}" -Atc 'select count(*) from public.categories')" = "${EXPECTED_CATEGORIES}"
          test "$(psql "${DB_URL}" -Atc 'select count(*) from public.offers')" = "${EXPECTED_OFFERS}"
          pnpm db:test

      - name: Create structured rehearsal evidence
        id: evidence
        shell: bash
        env:
          STARTED_EPOCH: ${{ steps.timing.outputs.started_epoch }}
          EXPECTED_CATEGORIES: ${{ steps.before.outputs.categories }}
          EXPECTED_OFFERS: ${{ steps.before.outputs.offers }}
        run: |
          set -euo pipefail
          finished_epoch="$(date -u +%s)"
          [[ "${STARTED_EPOCH}" =~ ^[0-9]+$ ]]
          [[ "${EVIDENCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          duration_seconds="$((finished_epoch - STARTED_EPOCH))"
          (( duration_seconds >= 0 ))
          mkdir -p recovery-evidence
          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg commit_sha "${EVIDENCE_COMMIT_SHA}" \
            --arg event_name "${GITHUB_EVENT_NAME}" \
            --arg verified_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson duration_seconds "${duration_seconds}" \
            --argjson categories "${EXPECTED_CATEGORIES}" \
            --argjson offers "${EXPECTED_OFFERS}" \
            '{
              schemaVersion: 1,
              kind: "database-recovery-rehearsal",
              repository: $repository,
              workflow: {
                runId: $run_id,
                runAttempt: $run_attempt,
                event: $event_name
              },
              commitSha: $commit_sha,
              source: "deterministic-local-supabase-seed",
              productionDataCopied: false,
              productionSecretsUsed: false,
              encryptedBeforePersistence: true,
              targetRebuiltFromVersionedMigrations: true,
              durationSeconds: $duration_seconds,
              aggregateCounts: {
                categories: $categories,
                offers: $offers
              },
              checks: [
                {name: "encrypted-backup-integrity", ok: true},
                {name: "clean-target-rebuild", ok: true},
                {name: "representative-data-restore", ok: true},
                {name: "database-authorization-tests", ok: true}
              ],
              verifiedAt: $verified_at
            }' > recovery-evidence/recovery-evidence.json
          echo "duration_seconds=${duration_seconds}" >> "${GITHUB_OUTPUT}"

      - name: Upload recovery rehearsal evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-recovery-evidence-${{ github.run_id }}
          path: recovery-evidence/recovery-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish rehearsal evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Database recovery rehearsal"
            echo ""
            echo "- Source: deterministic local Supabase seed"
            echo "- Production data copied into CI: no"
            echo "- Production secrets used: no"
            echo "- Runner: ubuntu-24.04"
            echo "- Backup encrypted before persistence: yes"
            echo "- Restore target rebuilt from versioned migrations: yes"
            echo "- Restored data checked: categories + offers"
            echo "- RLS/auth database tests: executed"
            echo "- Evidence commit: \`${EVIDENCE_COMMIT_SHA}\`"
            echo "- Measured duration: \`${{ steps.evidence.outputs.duration_seconds || 'unavailable' }}s\`"
            echo "- Structured evidence retention: \`${RECOVERY_EVIDENCE_RETENTION_DAYS} days\`"
            echo "- Structured evidence contains Production data/PII: no"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove decrypted material
        if: always()
        run: rm -rf rehearsal-backup restore-input recovery-evidence

      - name: Stop local database
        if: always()
        run: pnpm exec supabase stop --no-backup

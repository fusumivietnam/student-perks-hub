name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed commit SHA to release
        type: string
        required: true
      apply_migrations:
        description: Apply pending Production Supabase migrations before deployment
        type: boolean
        required: true
        default: false
      migration_class:
        description: Migration risk class for this release
        type: choice
        required: true
        default: none
        options:
          - none
          - backward-compatible
          - coordinated
          - destructive
      dry_run:
        description: Validate provenance and Production migration plan without deploying
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate exact reviewed commit
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit_sha must be a full 40-character Git SHA."; exit 1; }
          git fetch origin main --no-tags
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          git merge-base --is-ancestor "${REQUESTED_SHA}" origin/main || { echo "Release SHA must be reachable from protected main."; exit 1; }
          resolved="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and CodeQL for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
          jq -e '.workflow_runs | any(.name == "CI" and .head_sha == env.RELEASE_SHA and .conclusion == "success")' <<< "${payload}" >/dev/null
          jq -e '.workflow_runs | any(.name == "CodeQL" and .head_sha == env.RELEASE_SHA and .conclusion == "success")' <<< "${payload}" >/dev/null

  migration-plan:
    name: Resolve Production database migration plan
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Enforce migration policy
        shell: bash
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          MIGRATION_CLASS: ${{ inputs.migration_class }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${APPLY_MIGRATIONS}" == "true" ]]; then
            [[ "${MIGRATION_CLASS}" != "none" ]] || { echo "apply_migrations=true requires a migration class."; exit 1; }
            if [[ "${DRY_RUN}" != "true" && "${MIGRATION_CLASS}" != "backward-compatible" ]]; then
              echo "Only backward-compatible migrations may be applied automatically."
              exit 1
            fi
          else
            [[ "${MIGRATION_CLASS}" == "none" ]] || { echo "apply_migrations=false requires migration_class=none."; exit 1; }
            echo "No Production database migration requested."
          fi

      - name: Checkout exact release SHA
        if: inputs.apply_migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up pnpm
        if: inputs.apply_migrations
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        if: inputs.apply_migrations
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: inputs.apply_migrations
        run: pnpm install --frozen-lockfile

      - name: Link Production Supabase
        if: inputs.apply_migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN}"
          test -n "${SUPABASE_PROJECT_REF}"
          test -n "${SUPABASE_DB_PASSWORD}"
          pnpm exec supabase link --project-ref "${SUPABASE_PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Dry-run pending migrations
        if: inputs.apply_migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          pnpm exec supabase db push --dry-run --db-url "${SUPABASE_DB_URL}"

      - name: Apply backward-compatible migrations
        if: inputs.apply_migrations && inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          pnpm exec supabase db push --db-url "${SUPABASE_DB_URL}"

  deploy:
    name: Deploy exact SHA to Vercel Production
    needs: [validate, migration-plan]
    if: |
      inputs.dry_run == false &&
      needs.validate.result == 'success' &&
      needs.migration-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Vercel CLI
        shell: bash
        env:
          VERCEL_CLI_VERSION: "59.23.1"
        run: |
          set -euo pipefail
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

      - name: Pull Production Vercel environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          vercel pull --yes --environment=production

      - name: Build Production Vercel artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy immutable Production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes | tail -n 1)"
          [[ "${deployment_url}" =~ ^https:// ]] || { echo "Could not resolve deployment URL: ${deployment_url}"; exit 1; }
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Post-deploy smoke checks
    needs: [validate, migration-plan, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run smoke verification and record evidence
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          RELEASE_ENVIRONMENT: production
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          MIGRATION_STATE: ${{ inputs.apply_migrations && 'applied' || 'not-requested' }}
        run: node scripts/smoke-release.mjs

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-production-${{ needs.validate.outputs.release_sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: Release Gate
    needs: [validate, migration-plan, deploy, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate terminal release state
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MIGRATION_RESULT: ${{ needs.migration-plan.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "${VALIDATE_RESULT}" == "success" ]]
          [[ "${MIGRATION_RESULT}" == "success" ]]

          if [[ "${DRY_RUN}" == "true" ]]; then
            [[ "${DEPLOY_RESULT}" == "skipped" ]]
            [[ "${SMOKE_RESULT}" == "skipped" ]]
            echo "Dry-run release validation completed successfully."
            exit 0
          fi

          [[ "${DEPLOY_RESULT}" == "success" ]]
          [[ "${SMOKE_RESULT}" == "success" ]]
          [[ "${DEPLOYMENT_URL}" =~ ^https:// ]]

          artifact_name="release-evidence-production-${RELEASE_SHA}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "${artifact_name}" '.artifacts | any(.name == $name and .expired == false)' <<< "${artifacts}" >/dev/null

          echo "Production release completed with deploy, smoke, and evidence artifact."

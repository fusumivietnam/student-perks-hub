name: Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact reviewed commit SHA to release
        type: string
        required: true
      apply_migrations:
        description: Apply pending Production Supabase migrations before deployment
        type: boolean
        required: true
        default: false
      migration_class:
        description: Migration risk class for this release
        type: choice
        required: true
        default: none
        options:
          - none
          - backward-compatible
          - coordinated
          - destructive
      dry_run:
        description: Validate provenance and Production migration plan without deploying
        type: boolean
        required: true
        default: true
      release_issue_number:
        description: Originating [release] production issue number, when dispatched by the bridge
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate exact reviewed commit
        id: release
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_SHA}" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "commit_sha must be a full 40-character Git SHA."; exit 1; }
          git fetch origin main --no-tags
          git cat-file -e "${REQUESTED_SHA}^{commit}"
          git merge-base --is-ancestor "${REQUESTED_SHA}" origin/main || { echo "Release SHA must be reachable from protected main."; exit 1; }
          resolved="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          echo "sha=${resolved}" >> "$GITHUB_OUTPUT"

      - name: Require successful CI and CodeQL for exact SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${RELEASE_SHA}&per_page=100")"
          jq -e '.workflow_runs | any(.name == "CI" and .head_sha == env.RELEASE_SHA and .conclusion == "success")' <<< "${payload}" >/dev/null
          jq -e '.workflow_runs | any(.name == "CodeQL" and .head_sha == env.RELEASE_SHA and .conclusion == "success")' <<< "${payload}" >/dev/null

  migration-plan:
    name: Resolve Production database migration plan
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    outputs:
      migration_state: ${{ steps.final-state.outputs.state }}
      local_migration_head: ${{ steps.final-state.outputs.local_head }}
      remote_migration_head: ${{ steps.final-state.outputs.remote_head }}

    steps:
      - name: Enforce migration policy
        shell: bash
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          MIGRATION_CLASS: ${{ inputs.migration_class }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "${APPLY_MIGRATIONS}" == "true" ]]; then
            [[ "${MIGRATION_CLASS}" != "none" ]] || { echo "apply_migrations=true requires a migration class."; exit 1; }
            if [[ "${DRY_RUN}" != "true" && "${MIGRATION_CLASS}" != "backward-compatible" ]]; then
              echo "Only backward-compatible migrations may be applied automatically."
              exit 1
            fi
          else
            [[ "${MIGRATION_CLASS}" == "none" ]] || { echo "apply_migrations=false requires migration_class=none."; exit 1; }
          fi

      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare repository and Production migration history
        id: migration-history
        shell: bash
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"

          local_file="$(mktemp)"
          cli_local_file="$(mktemp)"
          remote_file="$(mktemp)"
          normalized_file="$(mktemp)"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.*/\1/p' \
            | sort -u > "${local_file}"
          [[ -s "${local_file}" ]] || { echo "No local timestamped migrations found."; exit 1; }

          migration_output="$(pnpm exec supabase migration list --db-url "${SUPABASE_DB_URL}")"
          printf '%s\n' "${migration_output}"
          printf '%s\n' "${migration_output}" | sed 's/│/|/g' > "${normalized_file}"

          awk -F '|' '
            NF >= 2 {
              local_version=$1
              remote_version=$2
              gsub(/[^0-9]/, "", local_version)
              gsub(/[^0-9]/, "", remote_version)
              if (length(local_version) == 14) print local_version > local_out
              if (length(remote_version) == 14) print remote_version > remote_out
            }
          ' local_out="${cli_local_file}" remote_out="${remote_file}" "${normalized_file}"

          sort -u -o "${cli_local_file}" "${cli_local_file}"
          sort -u -o "${remote_file}" "${remote_file}"

          [[ -s "${cli_local_file}" ]] || {
            echo "Could not parse local migration history from Supabase CLI output. Failing closed."
            exit 1
          }
          [[ -s "${remote_file}" ]] || {
            echo "Could not parse Production migration history from Supabase CLI output. Failing closed."
            exit 1
          }
          cmp -s "${local_file}" "${cli_local_file}" || {
            echo "Supabase CLI local migration history does not match release-SHA migration files. Failing closed."
            echo "Repository migrations:"; cat "${local_file}"
            echo "CLI local migrations:"; cat "${cli_local_file}"
            exit 1
          }

          local_only="$(comm -23 "${local_file}" "${remote_file}")"
          remote_only="$(comm -13 "${local_file}" "${remote_file}")"
          local_head="$(tail -n 1 "${local_file}")"
          remote_head="$(tail -n 1 "${remote_file}")"
          pending_count="$(printf '%s\n' "${local_only}" | sed '/^$/d' | wc -l | tr -d ' ')"

          [[ "${local_head}" =~ ^[0-9]{14}$ ]]
          [[ "${remote_head}" =~ ^[0-9]{14}$ ]] || { echo "Production migration head is invalid. Failing closed."; exit 1; }

          if [[ -n "${remote_only}" ]]; then
            echo "Production migration history contains versions absent from the release SHA:"
            printf '%s\n' "${remote_only}"
            exit 1
          fi
          if [[ -n "${local_only}" && "${APPLY_MIGRATIONS}" != "true" ]]; then
            echo "Release requested apply_migrations=false but Production is missing repository migrations:"
            printf '%s\n' "${local_only}"
            exit 1
          fi

          echo "local_head=${local_head}" >> "$GITHUB_OUTPUT"
          echo "remote_head=${remote_head}" >> "$GITHUB_OUTPUT"
          echo "pending_count=${pending_count}" >> "$GITHUB_OUTPUT"

          if [[ -z "${local_only}" ]]; then
            echo "Repository and Production migration histories are synchronized at ${local_head}."
          else
            echo "Pending repository migrations are explicitly covered by apply_migrations=true:"
            printf '%s\n' "${local_only}"
          fi

      - name: Dry-run pending migrations
        if: inputs.apply_migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          pnpm exec supabase db push --dry-run --db-url "${SUPABASE_DB_URL}"

      - name: Apply backward-compatible migrations
        if: inputs.apply_migrations && inputs.dry_run == false
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"
          pnpm exec supabase db push --db-url "${SUPABASE_DB_URL}"

      - name: Verify migration history after apply
        if: inputs.apply_migrations && inputs.dry_run == false
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          local_file="$(mktemp)"
          cli_local_file="$(mktemp)"
          remote_file="$(mktemp)"
          normalized_file="$(mktemp)"

          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.*/\1/p' \
            | sort -u > "${local_file}"
          migration_output="$(pnpm exec supabase migration list --db-url "${SUPABASE_DB_URL}")"
          printf '%s\n' "${migration_output}"
          printf '%s\n' "${migration_output}" | sed 's/│/|/g' > "${normalized_file}"
          awk -F '|' '
            NF >= 2 {
              local_version=$1
              remote_version=$2
              gsub(/[^0-9]/, "", local_version)
              gsub(/[^0-9]/, "", remote_version)
              if (length(local_version) == 14) print local_version > local_out
              if (length(remote_version) == 14) print remote_version > remote_out
            }
          ' local_out="${cli_local_file}" remote_out="${remote_file}" "${normalized_file}"
          sort -u -o "${cli_local_file}" "${cli_local_file}"
          sort -u -o "${remote_file}" "${remote_file}"
          [[ -s "${cli_local_file}" && -s "${remote_file}" ]] || { echo "Could not parse migration history after apply. Failing closed."; exit 1; }
          cmp -s "${local_file}" "${cli_local_file}" || { echo "CLI local history differs from repository after apply."; exit 1; }
          cmp -s "${local_file}" "${remote_file}" || { echo "Production migration history is still divergent after apply."; exit 1; }

      - name: Record resolved migration state
        id: final-state
        shell: bash
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          DRY_RUN: ${{ inputs.dry_run }}
          PENDING_COUNT: ${{ steps.migration-history.outputs.pending_count }}
          LOCAL_HEAD: ${{ steps.migration-history.outputs.local_head }}
          PRE_REMOTE_HEAD: ${{ steps.migration-history.outputs.remote_head }}
        run: |
          set -euo pipefail
          state="synced"
          remote_head="${PRE_REMOTE_HEAD}"
          [[ "${LOCAL_HEAD}" =~ ^[0-9]{14}$ ]]
          [[ "${remote_head}" =~ ^[0-9]{14}$ ]] || { echo "Remote migration head missing or invalid. Failing closed."; exit 1; }

          if [[ "${APPLY_MIGRATIONS}" == "true" && "${PENDING_COUNT}" != "0" ]]; then
            if [[ "${DRY_RUN}" == "true" ]]; then
              state="pending-dry-run"
            else
              state="applied"
              remote_head="${LOCAL_HEAD}"
            fi
          fi

          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "local_head=${LOCAL_HEAD}" >> "$GITHUB_OUTPUT"
          echo "remote_head=${remote_head}" >> "$GITHUB_OUTPUT"
          echo "Resolved Production migration state: ${state}; local=${LOCAL_HEAD}; remote=${remote_head}."

  deploy:
    name: Deploy exact SHA to Vercel Production
    needs: [validate, migration-plan]
    if: |
      inputs.dry_run == false &&
      needs.validate.result == 'success' &&
      needs.migration-plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    outputs:
      deployment_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Vercel CLI
        shell: bash
        env:
          VERCEL_CLI_VERSION: "59.23.1"
        run: |
          set -euo pipefail
          npm install --global "vercel@${VERCEL_CLI_VERSION}"
          vercel --version

      - name: Pull Production Vercel environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN}"
          test -n "${VERCEL_ORG_ID}"
          test -n "${VERCEL_PROJECT_ID}"
          vercel pull --yes --environment=production

      - name: Build Production Vercel artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy immutable Production artifact
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes | tail -n 1)"
          [[ "${deployment_url}" =~ ^https:// ]] || { echo "Could not resolve deployment URL: ${deployment_url}"; exit 1; }
          echo "url=${deployment_url}" >> "$GITHUB_OUTPUT"

  smoke:
    name: Post-deploy smoke checks
    needs: [validate, migration-plan, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Run smoke verification and record evidence
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          RELEASE_ENVIRONMENT: production
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          MIGRATION_STATE: ${{ needs.migration-plan.outputs.migration_state }}
          MIGRATION_LOCAL_HEAD: ${{ needs.migration-plan.outputs.local_migration_head }}
          MIGRATION_REMOTE_HEAD: ${{ needs.migration-plan.outputs.remote_migration_head }}
        run: node scripts/smoke-release.mjs

      - name: Upload release evidence
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-evidence-production-${{ needs.validate.outputs.release_sha }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 30

  release-gate:
    name: Release Gate
    needs: [validate, migration-plan, deploy, smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Report terminal state to release command issue
        if: inputs.release_issue_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.release_issue_number }}
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MIGRATION_RESULT: ${{ needs.migration-plan.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          MIGRATION_STATE: ${{ needs.migration-plan.outputs.migration_state }}
          MIGRATION_LOCAL_HEAD: ${{ needs.migration-plan.outputs.local_migration_head }}
          MIGRATION_REMOTE_HEAD: ${{ needs.migration-plan.outputs.remote_migration_head }}
        run: |
          set -euo pipefail
          [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]] || { echo "release_issue_number must be numeric."; exit 1; }

          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}")"
          jq -e '.title == "[release] production" and .user.login == "fusumivietnam"' <<< "${issue_json}" >/dev/null || {
            echo "Refusing to write terminal release state to an untrusted issue."
            exit 1
          }

          terminal="failure"
          if [[ "${DRY_RUN}" == "true" ]]; then
            if [[ "${VALIDATE_RESULT}" == "success" && "${MIGRATION_RESULT}" == "success" && "${DEPLOY_RESULT}" == "skipped" && "${SMOKE_RESULT}" == "skipped" ]]; then
              terminal="success"
            fi
          elif [[ "${VALIDATE_RESULT}" == "success" && "${MIGRATION_RESULT}" == "success" && "${DEPLOY_RESULT}" == "success" && "${SMOKE_RESULT}" == "success" && "${DEPLOYMENT_URL}" =~ ^https:// ]]; then
            terminal="success"
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          artifact_name="release-evidence-production-${RELEASE_SHA}"
          body_file="$(mktemp)"
          {
            echo "Protected Release reached terminal state: **${terminal}**."
            echo
            echo "- Release run: ${run_url}"
            echo "- Exact SHA: \`${RELEASE_SHA:-unresolved}\`"
            echo "- Dry run: \`${DRY_RUN}\`"
            echo "- Migration job: \`${MIGRATION_RESULT}\`"
            echo "- Migration state: \`${MIGRATION_STATE:-unresolved}\`"
            echo "- Migration local head: \`${MIGRATION_LOCAL_HEAD:-unresolved}\`"
            echo "- Migration remote head: \`${MIGRATION_REMOTE_HEAD:-unresolved}\`"
            echo "- Deploy job: \`${DEPLOY_RESULT}\`"
            echo "- Smoke job: \`${SMOKE_RESULT}\`"
            if [[ -n "${DEPLOYMENT_URL}" ]]; then
              echo "- Deployment: ${DEPLOYMENT_URL}"
            fi
            if [[ "${DRY_RUN}" != "true" && "${terminal}" == "success" ]]; then
              echo "- Evidence artifact: \`${artifact_name}\`"
            fi
          } > "${body_file}"

          gh issue comment "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body-file "${body_file}"

          if [[ "${terminal}" == "success" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" -f state=closed -f state_reason=completed >/dev/null
          fi

      - name: Validate terminal release state
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          MIGRATION_RESULT: ${{ needs.migration-plan.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${VALIDATE_RESULT}" == "success" ]]
          [[ "${MIGRATION_RESULT}" == "success" ]]

          if [[ "${DRY_RUN}" == "true" ]]; then
            [[ "${DEPLOY_RESULT}" == "skipped" ]]
            [[ "${SMOKE_RESULT}" == "skipped" ]]
            echo "Dry-run release validation completed successfully."
            exit 0
          fi

          [[ "${DEPLOY_RESULT}" == "success" ]]
          [[ "${SMOKE_RESULT}" == "success" ]]
          [[ "${DEPLOYMENT_URL}" =~ ^https:// ]]

          artifact_name="release-evidence-production-${RELEASE_SHA}"
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          jq -e --arg name "${artifact_name}" '.artifacts | any(.name == $name and .expired == false)' <<< "${artifacts}" >/dev/null
          echo "Production release completed with deploy, smoke, and evidence artifact."

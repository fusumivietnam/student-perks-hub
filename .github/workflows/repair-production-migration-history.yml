name: Repair Production Migration History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REPAIR-20261006 to confirm the one-time Production migration history repair'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-migration-history-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Repair Production migration history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "REPAIR-20261006" ]] || {
            echo "Confirmation value does not match the required guard."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate protected Production database URL
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL}"

      - name: Show migration history before repair
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm exec supabase migration list --db-url "${SUPABASE_DB_URL}"

      - name: Mark legacy Production versions reverted
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase migration repair --db-url "${SUPABASE_DB_URL}" --status reverted \
            20261004005141 \
            20261004005148 \
            20261004005200 \
            20261004005629

      - name: Mark repository versions applied
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec supabase migration repair --db-url "${SUPABASE_DB_URL}" --status applied \
            20261001114100 \
            20261001174500 \
            20261002095000 \
            20261004005500

      - name: Verify migration history after repair
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          output="$(pnpm exec supabase migration list --db-url "${SUPABASE_DB_URL}")"
          printf '%s\n' "${output}"

          for version in \
            20261001114100 \
            20261001174500 \
            20261002095000 \
            20261004005500; do
            grep -q "${version}.*${version}" <<<"${output}" || {
              echo "Expected aligned migration ${version} was not found."
              exit 1
            }
          done

          for legacy in \
            20261004005141 \
            20261004005148 \
            20261004005200 \
            20261004005629; do
            if grep -q "${legacy}" <<<"${output}"; then
              echo "Legacy migration version ${legacy} is still present."
              exit 1
            fi
          done

          echo "Production migration history is aligned with repository migrations."

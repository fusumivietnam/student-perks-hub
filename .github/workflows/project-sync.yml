name: Project Sync

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/project-sync.yml"
      - ".github/scripts/project_sync.py"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: project-sync-${{ github.event.issue.number || github.event.pull_request.number || 'global' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      PROJECT_NUMBER: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure and sync Project
        run: python3 .github/scripts/project_sync.py

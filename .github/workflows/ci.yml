name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      database: ${{ steps.filter.outputs.database }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect validation scope
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            changed_files="$(git show --pretty='' --name-only "${HEAD_SHA}")"
          else
            changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          fi

          printf '%s\n' "${changed_files}"

          if grep -Eq '^(supabase/|scripts/ci-supabase-start\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|lib/database\.types\.ts$|\.github/workflows/ci\.yml$)' <<< "${changed_files}"; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -Eq '^(app/|components/|lib/|supabase/|e2e/|scripts/(ci-supabase-start|e2e-(setup|start))\.mjs$|(playwright\.config\.mjs|lighthouserc\.cjs)$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|next\.config\.(js|mjs|ts)$|\.github/workflows/ci\.yml$)' <<< "${changed_files}"; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.mjs', '**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  database:
    name: Database validation
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Postgres with cleanup/retry
        run: node scripts/ci-supabase-start.mjs db

      - name: Rebuild database from migrations and seed
        run: pnpm db:reset

      - name: Test database authorization and RLS
        run: pnpm db:test

      - name: Generate database types
        run: pnpm db:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- lib/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: Browser E2E
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_VERSION: "1.63.0"
      AXE_PLAYWRIGHT_VERSION: "4.13.0"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned browser test tools
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --save-dev --ignore-workspace-root-check --lockfile=false \
            "@playwright/test@${PLAYWRIGHT_VERSION}" \
            "@axe-core/playwright@${AXE_PLAYWRIGHT_VERSION}"
          git checkout -- package.json

      - name: Restore Chromium cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.63.0-chromium

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Start minimal local Supabase
        run: node scripts/e2e-start.mjs

      - name: Rebuild deterministic database
        run: pnpm db:reset

      - name: Create deterministic E2E user
        run: node scripts/e2e-setup.mjs

      - name: Restore Next.js production build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-e2e-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-e2e-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build production application
        run: pnpm build

      - name: Run critical browser flows
        run: pnpm exec playwright test

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm local:stop

  lighthouse:
    name: Lighthouse budget
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      LHCI_VERSION: "0.15.1"
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Lighthouse CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --save-dev --ignore-workspace-root-check --lockfile=false \
            "@lhci/cli@${LHCI_VERSION}"
          git checkout -- package.json

      - name: Start minimal local Supabase
        run: node scripts/e2e-start.mjs

      - name: Rebuild deterministic database
        run: pnpm db:reset

      - name: Restore Next.js production build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-lighthouse-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-lighthouse-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build production application
        run: pnpm build

      - name: Run Lighthouse performance budget
        shell: bash
        run: |
          set -euo pipefail
          chrome_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "${chrome_path}" ]]; then
            echo "No system Chrome/Chromium found on the pinned runner." >&2
            exit 1
          fi
          export CHROME_PATH="${chrome_path}"
          pnpm exec lhci autorun --config=./lighthouserc.cjs

      - name: Upload Lighthouse diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-failure-${{ github.run_id }}
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: pnpm local:stop

  gate:
    name: CI Gate
    needs: [changes, verify, database, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Validate required CI results
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          set -euo pipefail

          [[ "${CHANGES_RESULT}" == "success" ]]
          [[ "${VERIFY_RESULT}" == "success" ]]
          [[ "${DATABASE_RESULT}" == "success" || "${DATABASE_RESULT}" == "skipped" ]]
          [[ "${E2E_RESULT}" == "success" || "${E2E_RESULT}" == "skipped" ]]
          [[ "${LIGHTHOUSE_RESULT}" == "success" || "${LIGHTHOUSE_RESULT}" == "skipped" ]]

name: Database CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "lib/database.types.ts"
      - ".github/workflows/database.yml"
  push:
    branches: [main, feat/20-admin-authorization]
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing; installing without frozen lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild database from migrations and seed
        run: pnpm db:reset

      - name: Test database authorization and RLS
        run: pnpm db:test

      - name: Generate database types
        run: pnpm db:types

      - name: Bootstrap generated types on admin branch
        if: github.ref == 'refs/heads/feat/20-admin-authorization'
        shell: bash
        run: |
          set -euo pipefail
          git add lib/database.types.ts pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Generated files already match."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh generated database types"
          git pull --rebase origin feat/20-admin-authorization
          git push origin HEAD:feat/20-admin-authorization

      - name: Verify generated types are committed
        if: github.ref != 'refs/heads/feat/20-admin-authorization'
        run: git diff --exit-code -- lib/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

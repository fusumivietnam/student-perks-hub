name: Database CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"
  push:
    branches: [main, chore/current-roadmap-db-types]
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.PROJECT_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing; installing without frozen lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild database from migrations and seed
        run: pnpm db:reset

      - name: Generate database types
        run: pnpm db:types

      - name: Commit generated types on bootstrap branch
        if: github.ref == 'refs/heads/chore/current-roadmap-db-types'
        shell: bash
        run: |
          set -euo pipefail
          git add lib/database.types.ts
          if git diff --cached --quiet; then
            echo "Database types already match the local schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: generate Supabase database types"
          git push origin HEAD:chore/current-roadmap-db-types

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

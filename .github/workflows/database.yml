name: Database CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_AUTH_SITE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml is missing; installing without frozen lockfile"
            pnpm install --no-frozen-lockfile
          fi

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Rebuild database from migrations and seed
        run: pnpm db:reset

      - name: Verify type generation
        run: pnpm exec supabase gen types typescript --local > /tmp/database.types.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
